services:
  db:
    image: postgres:alpine
    container_name: real_pg_container
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: "real-db"
    ports:
      - "5432:5432"
    volumes:
      - real_pg_data:/var/lib/postgresql

volumes:
  real_pg_data: